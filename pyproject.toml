[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huion-note-pipeline"
version = "1.7.3"
description = "BLE sync and note-to-markdown companion pipeline for Huion Note X10"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dbus-fast>=2.0.0",
    "evdev>=1.7.0",
    "PyYAML>=6.0",
    "Pillow>=10.0.0",
    "cairosvg>=2.7.0",
    "pystray>=0.19.0",
    "PySide6-Essentials>=6.8.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[project.scripts]
huion = "huion.cli:main"
huionnote = "huion_note_pipeline.gui.qt_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"huion_note_pipeline.gui" = ["icons/lucide/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
